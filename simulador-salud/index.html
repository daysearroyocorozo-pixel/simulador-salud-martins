<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>No disponible</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f5f1; color: #223146; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 .4em; }
  p { margin: 0; color: #5d6577; }
</style>
</head>
<body>
  <main><h1>Esta página no está disponible</h1><p>El contenido ya no se encuentra publicado.</p></main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  </script>
</body>
</html>
